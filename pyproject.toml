[project]
name = "openjetbolt"
version = "0.1.0"
description = "Talk to a Jetson Bolt E-Bike BLE controller directly, without the official app."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "bleak",
]

# Only pulled in via `pip install -e ".[test]"` -- never required to just run
# OpenJetBolt.py (see README "Development / running tests").
[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3",
]

# Without this, setuptools' automatic package discovery finds every
# top-level directory with an __init__.py-like layout -- including
# unrelated ones like images/ -- and refuses to build ("Multiple
# top-level packages discovered in a flat-layout"). `helpers/` is the only
# thing that's actually an importable package here.
[tool.setuptools]
packages = ["helpers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
